<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>XExport — X Article → PDF</title>
<style>
  :root{
    --bg:#ffffff; --fg:#0f1419; --mut:#536471; --line:#e1e8ed;
    --acc:#1d9bf0; --ok:#00ba7c; --brand:#e02424; --chip:#f1f5f9;
    --hover:#eff3f4; --badge-bg:#eef2f6; --badge-fg:#475569;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15202b; --fg:#e7e9ea; --mut:#8b98a5; --line:#38444d;
      --acc:#1d9bf0; --ok:#00ba7c; --brand:#f4212e; --chip:#1e2732;
      --hover:#273340; --badge-bg:#273340; --badge-fg:#94a3b8;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; width:296px; background:var(--bg); color:var(--fg);
    font:12px/1.4 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }

  .head{padding:10px 10px 8px; border-bottom:1px solid var(--line)}
  .head-top{display:flex; align-items:center; justify-content:space-between}
  .brand{display:flex; align-items:center; min-width:0}
  .brand-logo{width:20px; height:20px; flex:none; margin-inline-end:8px}
  .brand h1{font-size:13px; font-weight:700; margin:0; white-space:nowrap; letter-spacing:-0.01em}

  .guide-btn{
    display:inline-flex; align-items:center; justify-content:center;
    height:30px; padding:0 10px; border:1px solid var(--line); border-radius:6px;
    background:var(--chip); color:var(--fg); font:inherit; font-size:12px; font-weight:600;
    cursor:pointer; white-space:nowrap; flex:none; margin-inline-start:8px;
  }
  .guide-btn:hover{background:var(--hover); border-color:var(--acc); color:var(--acc)}
  .guide-btn svg{width:14px; height:14px; flex:none; fill:currentColor; margin-inline-end:5px}

  .status-bar{
    margin-top:8px; padding:6px 8px; border-radius:6px; background:var(--chip);
    display:flex; align-items:center; min-height:28px;
  }
  .dot{width:7px; height:7px; border-radius:50%; background:var(--mut); flex:none; margin-inline-end:7px; opacity:0.65}
  .status-bar.ok .dot{background:var(--ok); opacity:1}
  .status-bar.editor .dot{background:var(--acc); opacity:1}
  .status-text{font-size:12px; color:var(--mut); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .status-bar.ok .status-text{color:var(--fg); font-weight:500}
  .status-bar.editor .status-text{color:var(--acc); font-weight:500}
  .status-action{
    flex:none; height:20px; padding:0 4px; margin-inline-start:8px;
    border:0; background:none; color:var(--acc); font:inherit; font-size:12px; font-weight:600;
    cursor:pointer; white-space:nowrap;
  }
  .status-action:hover{text-decoration:underline}

  .groups{padding:8px 10px 10px}
  .group-label{
    font-size:11px; font-weight:600; color:var(--mut);
    margin:0 0 6px 2px; line-height:1.2;
  }
  .group-label.cloud{margin-top:10px}

  .row{
    display:flex; align-items:center; width:100%; height:30px; text-align:start;
    padding:0 8px; border:0; border-radius:6px; background:none; color:var(--fg);
    font:inherit; font-size:12px; white-space:nowrap; cursor:pointer; margin-bottom:4px;
  }
  .row:last-child{margin-bottom:0}
  .row:hover:not(:disabled){background:var(--hover)}
  .row:disabled{opacity:.42; cursor:default}
  .row svg{width:15px; height:15px; flex:none; fill:currentColor; margin-inline-end:8px}
  .row.primary-row:not(:disabled) svg{color:var(--brand)}
  .row .lbl{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .tag{
    flex:none; margin-inline-start:8px; padding:1px 6px; border-radius:4px;
    background:var(--badge-bg); color:var(--badge-fg); font-size:11px; font-weight:600;
    line-height:1.4; white-space:nowrap;
  }

  .foot{padding:8px 10px 10px; border-top:1px solid var(--line)}
  .row.foot-row{margin-bottom:0}
  .row .badge{color:var(--mut); font-size:12px; white-space:nowrap; margin-inline-start:8px}
  .row .chev{color:var(--mut); font-size:13px; margin-inline-start:4px; line-height:1}
</style>
</head>
<body>
  <div class="head">
    <div class="head-top">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" rx="6" fill="#e02424"/>
          <path fill="#fff" fill-rule="evenodd" d="M7.5 5h6.2L18 9.3V18a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 18V6.5A1.5 1.5 0 0 1 7.5 5Zm5.5 1.3V10h3.7L13 6.3Z"/>
          <path fill="#fff" d="M11.3 11.2h1.4v3.4l1-1 .95.95-2.65 2.65-2.65-2.65.95-.95 1 1v-3.4Z"/>
        </svg>
        <h1 id="titleText">XExport · X → PDF</h1>
      </div>
      <button class="guide-btn" id="guide" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v16.5H6.5A2.5 2.5 0 0 0 4 21V5.5Zm16 0A2.5 2.5 0 0 0 17.5 3H12v16.5h5.5a2.5 2.5 0 0 1 2.5 1.5V5.5Z"/></svg>
        <span id="guideLabel">Guide</span>
      </button>
    </div>
    <div class="status-bar" id="statusBar">
      <span class="dot" aria-hidden="true"></span>
      <span class="status-text" id="state">Checking page…</span>
      <button class="status-action" id="stateAction" type="button" hidden></button>
    </div>
  </div>

  <div class="groups">
    <div class="group-label" id="lblLocal">Local &amp; AI Export</div>
    <button class="row primary-row" id="pdf" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M6 2h8.4L20 7.6V20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm0 1.75a.25.25 0 0 0-.25.25v16c0 .14.11.25.25.25h12a.25.25 0 0 0 .25-.25V9h-4.5a1.5 1.5 0 0 1-1.5-1.5V3.75H6Zm8 .81v2.94c0 .14.11.25.25.25h2.94L14 4.56Z"/><path d="M11.25 10.5h1.5v4.44l1.22-1.22 1.06 1.06-2.5 2.5a.75.75 0 0 1-1.06 0l-2.5-2.5 1.06-1.06 1.22 1.22V10.5Z"/></svg>
      <span class="lbl" id="lblPdf">Export PDF</span>
      <span class="tag">PDF</span>
    </button>
    <button class="row" id="md" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm.75 1.75v10.5h16.5V6.75H3.75Z"/><path d="M5.5 15.5v-7h1.8l1.7 2.6 1.7-2.6h1.8v7h-1.8v-4.2l-1.7 2.5-1.7-2.5v4.2H5.5Zm11.3 0-2.4-3h1.5v-4h1.8v4h1.5l-2.4 3Z"/></svg>
      <span class="lbl" id="lblMd">Export Markdown</span>
      <span class="tag">.md</span>
    </button>
    <button class="row" id="html" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 9h-3.2a15.7 15.7 0 0 0-1-5.1A8.3 8.3 0 0 1 18.9 11ZM12 3.9c.7 1 1.6 3.2 1.8 7.1h-3.6c.2-3.9 1.1-6.1 1.8-7.1ZM5.1 11a8.3 8.3 0 0 1 4.2-5.1 15.7 15.7 0 0 0-1 5.1H5.1Zm0 2h3.2c.1 2 .5 3.8 1 5.1A8.3 8.3 0 0 1 5.1 13Zm5.1 0h3.6c-.2 3.9-1.1 6.1-1.8 7.1-.7-1-1.6-3.2-1.8-7.1Zm4.5 5.1c.5-1.3.9-3.1 1-5.1h3.2a8.3 8.3 0 0 1-4.2 5.1Z"/></svg>
      <span class="lbl" id="lblHtml">Offline HTML</span>
      <span class="tag">.html</span>
    </button>
    <button class="row" id="grok" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 14.3 8l5.7 2.2-5.7 2.3L12 18l-2.3-5.5L4 10.2 9.7 8 12 2.5Zm6.5 13 1 2.4 2.5 1-2.5 1-1 2.6-1-2.6-2.5-1 2.5-1 1-2.4Z"/></svg>
      <span class="lbl" id="lblGrok">Grok AI Article</span>
      <span class="tag">AI</span>
    </button>

    <div class="group-label cloud" id="lblCloud">Google Cloud Sync</div>
    <button class="row" id="gdoc" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M6 2h8.4L20 7.6V20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm0 1.75a.25.25 0 0 0-.25.25v16c0 .14.11.25.25.25h12a.25.25 0 0 0 .25-.25V9h-4.5a1.5 1.5 0 0 1-1.5-1.5V3.75H6Zm8 .81v2.94c0 .14.11.25.25.25h2.94L14 4.56Z"/><path d="M8 12.25h8v1.5H8v-1.5Zm0 3h5.5v1.5H8v-1.5Z"/></svg>
      <span class="lbl" id="lblGdoc">Save to Google Docs</span>
      <span class="tag">Docs</span>
    </button>
    <button class="row" id="gdrive" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.71 3.5h8.58l5.71 9.89-4.29 7.11H6.29L2 13.39 7.71 3.5Zm1.01 1.75L4.03 13.39l3.27 5.36h9.4l3.27-5.36-4.69-8.14H8.72Zm3.28 2.5 3.25 5.5H8.75L12 7.75Z"/></svg>
      <span class="lbl" id="lblGdrive">Save PDF to Drive</span>
      <span class="tag">Drive</span>
    </button>
  </div>

  <div class="foot">
    <button class="row foot-row" id="history" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4.2l1.6 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Zm2-.25a.25.25 0 0 0-.25.25v12c0 .14.11.25.25.25h14a.25.25 0 0 0 .25-.25V8a.25.25 0 0 0-.25-.25h-9.1L8.3 5.75H5Z"/></svg>
      <span class="lbl" id="lblHistory">Export History</span>
      <span class="badge" id="usageMeta"></span>
      <span class="chev" aria-hidden="true">›</span>
    </button>
  </div>

<script src="archive.js"></script>
<script src="popup.js"></script>
</body>
</html>
